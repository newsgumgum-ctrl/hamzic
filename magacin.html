<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#292929">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ALBEYK Magacin</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#292929; --muted:#6A6A70; --line:#DFE2E7; --bg:#EEF0F3; --card:#FFFFFF; --soft:#F5F6F8;
  --red:#DD0001; --red-soft:#FDE6E6; --gold:#FDB103; --gold-soft:#FFF2CC; --green:#14915A; --green-soft:#DEF3E8; --blue:#2453C4; --blue-soft:#E4ECFF;
  --side:236px; color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
[hidden]{display:none !important}
h1,h2,h3{letter-spacing:-.01em;margin:0}

/* ---------- raspored: bočni meni (računar) / donji meni (telefon) ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:18px 12px;padding-top:calc(18px + env(safe-area-inset-top,0px));gap:4px;z-index:20}
.side .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;padding:0 8px 16px}
.side .brand img{width:38px;height:38px;border-radius:10px;background:#fff}
.side .brand small{display:block;font-size:12px;font-weight:700;color:#BDBDC2;letter-spacing:0}
.nav-btn{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#D8D8DC;font-weight:700;font-size:15.5px;padding:11px 12px;border-radius:12px;text-align:left;width:100%;position:relative}
.nav-btn svg{width:21px;height:21px;flex:none}
.nav-btn[aria-current="page"]{background:#fff;color:var(--ink)}
.nav-btn .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:1px 8px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.wrap{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:15;background:var(--bg);display:flex;align-items:center;gap:12px;padding:16px 28px 10px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.top h1{font-size:26px;font-weight:900}
.top .sub{color:var(--muted);font-weight:600;font-size:14px}
.top .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.bell{position:relative;width:46px;height:46px;border-radius:14px;border:0;background:var(--card);display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.bell svg{width:22px;height:22px}
.bell .cnt{position:absolute;top:-5px;right:-5px;min-width:22px;height:22px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 6px;border:2px solid var(--bg)}
.mbrand{display:none}
main{flex:1;padding:6px 28px 40px;max-width:1280px;width:100%}
.bottom{display:none}
.demo{background:var(--gold-soft);color:#5A3D00;font-size:14px;font-weight:600;padding:8px 28px}

@media (max-width:900px){
  .side{display:none}
  .wrap{margin-left:0}
  .top{padding:12px 16px 8px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .top h1{font-size:22px}
  .top .sub{display:none}
  .mbrand{display:block;width:34px;height:34px;border-radius:9px;background:#fff}
  main{padding:4px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .demo{padding:8px 16px}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 2px;border-radius:12px;position:relative}
  .bottom button svg{width:24px;height:24px}
  .bottom button[aria-current="page"]{color:var(--red)}
  .bottom .cnt{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:999px;font-size:10.5px;font-weight:900;padding:0 6px}
}

/* ---------- osnovni elementi ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media (max-width:700px){.g2{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.card > h2{font-size:18px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card > h2 .more{margin-left:auto;font-size:14px;font-weight:700}
.sec{margin:22px 0 10px;font-size:18px;font-weight:900;display:flex;align-items:center;gap:10px}
.sec:first-child{margin-top:6px}
.muted{color:var(--muted)}
.small{font-size:14px}
.kpi{background:var(--card);border-radius:18px;padding:16px 18px}
.kpi span{display:block;font-size:14px;font-weight:700;color:var(--muted)}
.kpi b{display:block;font-size:26px;font-weight:900;letter-spacing:-.02em;margin-top:2px}
.kpi small{color:var(--muted);font-weight:600;font-size:13px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn svg{width:19px;height:19px}
.b-ink{background:var(--ink);color:#fff}
.b-red{background:var(--red);color:#fff}
.b-gold{background:var(--gold);color:var(--ink)}
.b-green{background:var(--green);color:#fff}
.b-line{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.b-ghost{background:transparent;color:var(--ink);text-decoration:underline;min-height:auto;padding:6px 4px}
.b-sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.full{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14.5px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.chip .n{opacity:.7;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;white-space:nowrap}
.p-red{background:var(--red-soft);color:var(--red)}
.p-gold{background:var(--gold-soft);color:#7A5200}
.p-green{background:var(--green-soft);color:var(--green)}
.p-blue{background:var(--blue-soft);color:var(--blue)}
.p-gray{background:var(--soft);color:var(--muted)}
.search{flex:1;min-width:200px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--card);border-radius:12px;padding:12px 14px}
.empty{text-align:center;color:var(--muted);padding:28px 16px;font-weight:600}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* lista artikala */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
button.li:hover{background:var(--soft)}
.li .nm{font-weight:800;font-size:16px}
.li .meta{grid-column:1;font-size:13.5px;color:var(--muted);font-weight:600;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.li .qty{grid-row:1/3;grid-column:2;text-align:right;font-weight:900;font-size:20px;line-height:1.1}
.li .qty small{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
.li .qty.red{color:var(--red)}
.li .qty.gold{color:#B07800}
.bar{height:6px;border-radius:999px;background:var(--soft);overflow:hidden;width:120px;max-width:40vw}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--green)}
.bar i.gold{background:var(--gold)} .bar i.red{background:var(--red)}

/* tabela */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr.tot td{font-weight:900;border-bottom:0;border-top:2px solid var(--line)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}

/* obaveštenja */
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--soft);margin-bottom:8px}
.alert .dot{width:12px;height:12px;border-radius:50%}
.alert.red{background:var(--red-soft)} .alert.red .dot{background:var(--red)}
.alert.gold{background:var(--gold-soft)} .alert.gold .dot{background:var(--gold)}
.alert.blue{background:var(--blue-soft)} .alert.blue .dot{background:var(--blue)}
.alert b{display:block;font-size:15.5px}
.alert span{font-size:14px;color:#444;font-weight:600}
.alert.new{box-shadow:inset 0 0 0 2px currentColor}

/* nedelja */
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.weeknav b{font-size:17px;min-width:170px;text-align:center}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.week{grid-template-columns:1fr}}
.day{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.day.today{box-shadow:inset 0 0 0 2px var(--gold)}
.day h3{font-size:15px;font-weight:900;display:flex;justify-content:space-between}
.day h3 small{color:var(--muted);font-weight:700}
.slot{border:0;text-align:left;background:var(--soft);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-height:58px}
.slot .sl{font-size:12.5px;font-weight:800;color:var(--muted)}
.slot .ws{display:flex;gap:5px;flex-wrap:wrap}
.wchip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px 3px 4px;font-size:13px;font-weight:800;background:#fff}
.wchip i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px;font-weight:900}
.slot .add{font-size:13px;color:var(--muted);font-weight:700}

/* modal / sheet */
.ov{position:fixed;inset:0;z-index:60;background:rgba(20,20,22,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{background:var(--card);border-radius:22px;width:min(680px,100%);max-height:min(92vh,100%);display:flex;flex-direction:column;overflow:hidden}
.sheet.wide{width:min(980px,100%)}
.sh-h{display:flex;align-items:center;gap:10px;padding:18px 20px 10px}
.sh-h h2{font-size:21px;font-weight:900}
.sh-h .x{margin-left:auto;width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:22px;line-height:1}
.sh-b{padding:4px 20px 18px;overflow:auto;flex:1}
.sh-f{padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:700px){
  .ov{align-items:flex-end;padding:0}
  .sheet,.sheet.wide{width:100%;border-radius:22px 22px 0 0;max-height:94vh}
}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f > label,.f > .lb{font-weight:800;font-size:14px}
.f small{color:var(--muted);font-weight:600}
.in,select.in,textarea.in{width:100%;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:#fff;border-radius:12px;padding:11px 12px;min-height:46px}
.in:focus{outline:none;box-shadow:inset 0 0 0 2px var(--gold)}
textarea.in{min-height:70px;resize:vertical}
.fr{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.1fr) 40px;gap:8px;align-items:center;background:var(--soft);border-radius:14px;padding:8px}
.line.rec{grid-template-columns:minmax(0,3fr) minmax(0,1.2fr) 40px}
.line .u{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:2px}
.line .del{width:40px;height:40px;border:0;border-radius:10px;background:transparent;font-size:20px;color:var(--muted)}
@media (max-width:700px){
  .line{grid-template-columns:1fr 1fr 40px}
  .line > :first-child{grid-column:1/3}
  .line .del{grid-row:1;grid-column:3}
  .line.rec{grid-template-columns:1fr 110px 40px}
  .line.rec > :first-child{grid-column:auto}
  .line.rec .del{grid-row:auto;grid-column:auto}
}
.totbar{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:18px}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:3px}
.stepper button{width:36px;height:36px;border-radius:50%;border:0;background:#fff;font-weight:900;font-size:18px}
.stepper span{min-width:28px;text-align:center;font-weight:900}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0}
.pick .pn{font-weight:700}
.pick .pn small{display:block;color:var(--muted);font-weight:600}
.pick .in{max-width:120px;text-align:right}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:700}
.opt small{display:block;color:var(--muted);font-weight:600}
.opt input[type=checkbox]{width:24px;height:24px;accent-color:var(--red);flex:none}
details.fold{background:var(--soft);border-radius:14px;padding:4px 14px;margin-bottom:10px}
details.fold > summary{cursor:pointer;font-weight:900;padding:10px 0;list-style:none;display:flex;align-items:center;gap:8px}
details.fold > summary::after{content:"+";margin-left:auto;font-size:22px;font-weight:700;color:var(--muted)}
details.fold[open] > summary::after{content:"–"}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
@media (max-width:900px){.toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}}

/* prijava */
.start{position:fixed;inset:0;z-index:100;background:var(--ink);color:#fff;display:grid;place-items:center;text-align:center;padding:24px;overflow:auto}
.start img{width:100px;height:100px;border-radius:24px;background:#fff;margin:0 auto 18px}
.start h1{font-size:38px;font-weight:900;margin-bottom:10px}
.start p{margin:0 auto 22px;max-width:38ch;color:#D6D3CE;font-size:17px}
.admin-label{display:inline-block;font-weight:800;font-size:15px;border-radius:999px;padding:5px 12px;margin-bottom:16px;background:rgba(255,255,255,.14)}
.go{font-size:19px;font-weight:900;padding:16px 32px;border:0;background:var(--gold);color:var(--ink);border-radius:999px}
.login{width:min(380px,100%);margin:0 auto;text-align:left;background:#fff;color:var(--ink);border-radius:20px;padding:22px}
.login label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.login input{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.login .pw{position:relative}
.login .pw input{padding-right:96px}
.login .pw button{position:absolute;right:6px;top:6px;border:0;background:transparent;font-weight:800;font-size:14px;padding:8px 10px;color:var(--muted)}
.login .err{color:var(--red);font-weight:700;font-size:14px;min-height:20px;margin-bottom:6px}
.login .go-login{width:100%;border:0;border-radius:12px;padding:15px;font-weight:900;font-size:18px;background:var(--gold);color:var(--ink)}
.login .go-login:disabled{opacity:.6}
</style>
</head>
<body>
<div class="start" id="start">
  <div>
    <img src="logo.png" alt="">
    <h1>ALBEYK Magacin</h1>
    <span class="admin-label">Admin panel</span>
    <div id="loginBox" hidden></div>
    <div id="goBox" hidden><p>Učitavam…</p></div>
  </div>
</div>

<aside class="side" aria-label="Meni magacina">
  <div class="brand"><img src="logo.png" alt=""><div>Magacin<small>ALBEYK</small></div></div>
  <nav id="sideNav"></nav>
  <div class="foot">
    <button class="nav-btn" id="logoutSide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Odjavi se</button>
  </div>
</aside>

<div class="wrap">
  <div class="demo" id="demo" hidden>Demo režim: podaci se čuvaju samo u ovom browseru. Kad povežeš Firebase, magacin radi sa svih uređaja.</div>
  <header class="top">
    <img class="mbrand" src="logo.png" alt="">
    <div><h1 id="title">Pregled</h1><div class="sub" id="subtitle"></div></div>
    <div class="acts">
      <span id="topActs" class="row"></span>
      <button class="bell" id="bellBtn" aria-label="Obaveštenja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="cnt" id="bellCnt" hidden>0</span></button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="bottom" id="bottomNav" aria-label="Meni magacina"></nav>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="config.js"></script>

  let d = t(sh.to) - t(sh.from); if(d <= 0) d += 24; return Math.round(d * 100) / 100;
};

let STATS = {};
function computeStats(){
  const now = Date.now(), d7 = now - 7 * DAY, d14 = now - 14 * DAY;
  const u7 = {}, u14 = {};
  for(const m of S.moves){
    if(m.ts < d14) continue;
    let used = 0;
    if(m.qty < 0 && USE_TYPES.includes(m.type)) used = -m.qty;
    else if(m.type === "storno" && m.qty > 0) used = -m.qty;
    if(!used) continue;
    if(m.ts >= d7) u7[m.itemId] = (u7[m.itemId] || 0) + used;
    else u14[m.itemId] = (u14[m.itemId] || 0) + used;
  }
  const out = {};
  for(const it of S.items){
    const use7 = Math.max(0, u7[it.id] || 0), prev7 = Math.max(0, u14[it.id] || 0);
    const avg = use7 / 7;
    const days = avg > 0 ? (it.stock || 0) / avg : Infinity;
    const trend = prev7 > 0 ? (use7 - prev7) / prev7 : null;
    const cover = +S.set.coverDays || 7;
    let suggest = Math.max(0, avg * cover + (+it.min || 0) - (it.stock || 0));
    if(it.unit === "kom" || it.unit === "pak") suggest = Math.ceil(suggest); else suggest = Math.ceil(suggest * 2) / 2;
    out[it.id] = { use7, prev7, avg, days, trend, suggest };
  }
  STATS = out;
}
function status(it){
  const s = STATS[it.id] || {}, st = it.stock || 0;
  if(st < 0) return { k:"neg", lv:"red", t:"U minusu" };
  if(st <= 0 && ((+it.min || 0) > 0 || s.avg > 0)) return { k:"out", lv:"red", t:"Nema" };
  if((+it.min || 0) > 0 && st <= +it.min) return { k:"low", lv:"gold", t:"Pri kraju" };
  if(s.days <= (+S.set.warnDays || 3)) return { k:"soon", lv:"gold", t:`Još ~${Math.max(0, Math.floor(s.days))} d` };
  return { k:"ok", lv:"green", t:"U redu" };
}
const daysTxt = d => d === Infinity ? "–" : d < 1 ? "manje od dana" : `${Math.floor(d)} ${Math.floor(d) === 1 ? "dan" : "dana"}`;

function inRange(k, from, to){ return k >= from && k <= to; }
function workerCosts(from, to){
  const rows = {};
  const ensure = id => rows[id] || (rows[id] = { id, shifts:0, hours:0, pay:0, meals:0, mealCost:0, days:{} });
  S.shifts.filter(s => inRange(s.date, from, to)).forEach(s => {
    const r = ensure(s.workerId); r.shifts++; r.hours += +s.hours || 0; r.pay += +s.pay || 0;
    (r.days[s.date] ||= { shifts:[], meals:[] }).shifts.push(s);
  });
  S.meals.filter(m => inRange(m.day, from, to)).forEach(m => {
    const r = ensure(m.workerId); r.meals++; r.mealCost += +m.cost || 0;
    (r.days[m.day] ||= { shifts:[], meals:[] }).meals.push(m);
  });
  return rows;
}
function monthValues(){
  const ms = monthStart(today());
  let purchases = 0, cogs = 0;
  S.purchases.filter(p => p.date >= ms).forEach(p => purchases += +p.total || 0);
  S.moves.filter(m => m.day >= ms && m.qty < 0 && USE_TYPES.includes(m.type)).forEach(m => cogs += -m.qty * (m.cost || 0));
  S.moves.filter(m => m.day >= ms && m.type === "storno" && m.qty > 0).forEach(m => cogs -= m.qty * (m.cost || 0));
  const wc = Object.values(workerCosts(ms, today())).reduce((s, r) => s + r.pay + r.mealCost, 0);
  const stockValue = S.items.filter(i => i.active !== false).reduce((s, i) => s + Math.max(0, i.stock || 0) * (i.cost || 0), 0);
  return { purchases, cogs, wc, stockValue };
}

let ALERTS = [];
function computeAlerts(){
  const A = [], warn = +S.set.warnDays || 3, trends = [];
  for(const it of activeItems()){
    const s = STATS[it.id] || {}, st = status(it), q = fq(it.stock || 0, it.unit);
    if(st.k === "neg") A.push({ id:"neg:" + it.id, lv:"red", t:`Stanje u minusu: ${it.name}`, d:`Sistem pokazuje ${q}. Uradi popis ili proveri da li je nabavka uneta.`, item: it.id });
    else if(st.k === "out") A.push({ id:"out:" + it.id, lv:"red", t:`Nema na stanju: ${it.name}`, d:`Hitno naruči. Jela koja ga koriste ne mogu da se spreme.`, item: it.id });
    else if(st.k === "low") A.push({ id:"low:" + it.id, lv:"gold", t:`Pri kraju: ${it.name}`, d:`Ostalo ${q}, a minimum je ${fq(it.min, it.unit)}.${s.avg > 0 ? " Dovoljno za " + daysTxt(s.days) + "." : ""}`, item: it.id });
    else if(st.k === "soon") A.push({ id:"soon:" + it.id, lv:"gold", t:`Uskoro nestaje: ${it.name}`, d:`Po potrošnji iz poslednjih 7 dana, ${q} je dovoljno za još ${daysTxt(s.days)}.`, item: it.id });
    if(s.trend != null && s.trend >= .4 && s.use7 > 0 && s.prev7 > 0 && st.k === "ok" && s.days <= Math.max(10, (+S.set.coverDays || 7) * 1.5)) trends.push({ it, s });
  }
  /* brzo raste potrošnja: posebno upozorenje za do 3 artikla, inače jedno zbirno */
  trends.sort((a, b) => b.s.trend - a.s.trend);
  if(trends.length && trends.length <= 3) trends.forEach(({ it, s }) => A.push({ id:`trend:${it.id}:${weekStart(today())}`, lv:"blue", t:`Brzo se troši: ${it.name}`, d:`+${Math.round(s.trend * 100)}% u poslednjih 7 dana, dovoljno za još ${daysTxt(s.days)}. Naruči više nego obično.`, item: it.id }));
  else if(trends.length) A.push({ id:`trends:${weekStart(today())}:${trends.length}`, lv:"blue", t:`Potrošnja raste kod ${trends.length} artikala`, d:`Najviše: ${trends.slice(0, 4).map(({ it, s }) => `${it.name} +${Math.round(s.trend * 100)}%`).join(", ")}. Pogledaj predlog nabavke.`, go:"nabavka" });
  const yd = addDays(today(), -1);
  const closed = new Set(S.closings.map(c => c.day));
  const hadYd = S.moves.some(m => m.day === yd) || S.orders.some(o => o.day === yd);
  if(S.items.length && hadYd && !closed.has(yd)) A.push({ id:"close:" + yd, lv:"red", t:"Jučerašnja smena nije zatvorena", d:"Unesi šta je prodato u lokalu i potrošeno, da stanje bude tačno.", go:"smena" });
  if(S.items.length && belgradeHour() >= (+S.set.closeHour || 22) && !closed.has(today())) A.push({ id:"closeT:" + today(), lv:"gold", t:"Zatvori današnju smenu", d:"Na kraju dana unesi prodaju iz lokala i ostalu potrošnju.", go:"smena" });
  const miss = new Set();
  S.orders.filter(o => o.stockMissing && o.stockMissing.length).forEach(o => o.stockMissing.forEach(n => miss.add(n)));
  if(miss.size) A.push({ id:"norm:" + [...miss].sort().join("|"), lv:"gold", t:"Jelo bez normativa", d:`Sa stanja nije skinuto: ${[...miss].join(", ")}. Dodaj normativ.`, go:"normativi" });
  const wk = Date.now() - 7 * DAY;
  S.purchases.filter(p => (p.ts || 0) >= wk).forEach(p => (p.lines || []).forEach(l => {
    if(l.prevPrice > 0 && l.price > l.prevPrice * 1.1){
      const it = S.itemMap[l.itemId];
      A.push({ id:`price:${p.id}:${l.itemId}`, lv:"blue", t:`Poskupelo: ${it ? it.name : l.itemId}`, d:`${money(l.prevPrice)} na ${money(l.price)} po ${it ? it.unit : "jed."} (+${Math.round((l.price / l.prevPrice - 1) * 100)}%) kod ${p.supplier || "dobavljača"}.`, item: l.itemId });
    }
  }));
  const pend = S.fiscal.filter(f => f.status === "na_cekanju").length;
  if(S.set.fiscal?.enabled && pend) A.push({ id:"fiscal:" + pend, lv:"blue", t:`${pend} fiskalnih računa čeka kasu`, d:"Izdaće se kad povežemo kasu, ili ih označi kao izdate ručno.", go:"kasa" });
  const order = { red:0, gold:1, blue:2 };
  ALERTS = A.sort((a, b) => order[a.lv] - order[b.lv]);
}
const SEEN_KEY = "albeyk_mag_seen", NOTI_KEY = "albeyk_mag_notified";
const readSet = k => { try { return new Set(JSON.parse(localStorage.getItem(k)) || []); } catch(e){ return new Set(); } };
const writeSet = (k, s) => { try { localStorage.setItem(k, JSON.stringify([...s].slice(-400))); } catch(e){} };
let actx = null;
function unlockSound(){ try { if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch(e){} }
addEventListener("pointerdown", unlockSound, { once:true });
function beep(){
  if(EMBED){ try { parent.postMessage({ albeyk:"tone", notes:[[660,0,.25,.35],[880,.15,.4,.35]], wave:"sine" }, "*"); } catch(e){} return; }
  if(!actx) return;
  try {
    const t0 = actx.currentTime + .02;
    [[660,0],[880,.15]].forEach(([f, at]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + at); g.gain.linearRampToValueAtTime(.3, t0 + at + .01); g.gain.exponentialRampToValueAtTime(.001, t0 + at + .45);
      o.connect(g).connect(actx.destination); o.start(t0 + at); o.stop(t0 + at + .5); });
  } catch(e){}
}
let notifyReady = false;
function notifyNew(){
  if(!notifyReady) return;
  const done = readSet(NOTI_KEY);
  const fresh = ALERTS.filter(a => (a.lv === "red" || a.lv === "gold") && !done.has(a.id));
  if(!fresh.length) return;
  fresh.forEach(a => done.add(a.id)); writeSet(NOTI_KEY, done);
  beep();
  if("Notification" in window && Notification.permission === "granted"){
    const a = fresh[0];
    try { new Notification(fresh.length > 1 ? `ALBEYK Magacin: ${fresh.length} nova upozorenja` : "ALBEYK Magacin", { body: fresh.length > 1 ? fresh.map(x => x.t).slice(0, 4).join("\n") : a.t + "\n" + a.d, tag:"albeyk-mag" }); } catch(e){}
  }
  toast(fresh.length > 1 ? `${fresh.length} nova upozorenja u magacinu` : fresh[0].t);
}

/* ===== STANJE ===== */
let stFilter = { q:"", cat:"", st:"" };
VIEWS.stanje = () => {
  const V = $("#view"), items = activeItems();
  const cats = [...new Set(items.map(i => i.cat || "Ostalo"))];
  const cnt = k => items.filter(i => { const s = status(i).k; return k === "prob" ? s !== "ok" : s === k; }).length;
  $("#topActs").innerHTML = `<button class="btn b-gold b-sm" id="newItem">+ Novi artikal</button>`;
  $("#newItem").onclick = () => itemSheet(null);
  V.innerHTML = `
    <div class="row" style="margin-bottom:10px"><input class="search" id="stQ" type="search" placeholder="Traži artikal" value="${esc(stFilter.q)}"></div>
    <div class="chips" style="margin-bottom:8px">
      <button class="chip" data-st="" aria-pressed="${!stFilter.st}">Sve<span class="n">${items.length}</span></button>
      <button class="chip" data-st="prob" aria-pressed="${stFilter.st === "prob"}">Treba naručiti<span class="n">${cnt("prob")}</span></button>
      <button class="chip" data-st="out" aria-pressed="${stFilter.st === "out"}">Nema<span class="n">${cnt("out") + cnt("neg")}</span></button>
    </div>
    <div class="chips" style="margin-bottom:14px">
      <button class="chip" data-cat="" aria-pressed="${!stFilter.cat}">Sve kategorije</button>
      ${cats.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${stFilter.cat === c}">${esc(c)}</button>`).join("")}
    </div>
    <div class="card" style="padding:6px 16px"><div class="list" id="stList"></div></div>`;
  const draw = () => {
    const q = stFilter.q.trim().toLowerCase();
    const sev = i => ({ neg:0, out:0, low:1, soon:2, ok:3 })[status(i).k];
    const rows = [...items].sort((a, b) => sev(a) - sev(b)).filter(i => (!stFilter.cat || (i.cat || "Ostalo") === stFilter.cat) && (!q || i.name.toLowerCase().includes(q))
      && (!stFilter.st || (stFilter.st === "prob" ? status(i).k !== "ok" : ["out","neg"].includes(status(i).k))));
    $("#stList").innerHTML = rows.length ? rows.map(i => {
      const st = status(i), s = STATS[i.id] || {}, ratio = (+i.min > 0) ? Math.min(1, (i.stock || 0) / (+i.min * 3)) : (i.stock > 0 ? 1 : 0);
      return `<button class="li" data-item="${i.id}">
        <span class="nm">${esc(i.name)}</span>
        <span class="qty ${st.lv === "red" ? "red" : st.lv === "gold" ? "gold" : ""}">${fq(i.stock || 0, i.unit)}<small>${st.k === "ok" ? (s.avg > 0 ? "za " + daysTxt(s.days) : "min " + fq(i.min || 0, i.unit)) : st.t}</small></span>
        <span class="meta"><span class="bar"><i class="${st.lv === "green" ? "" : st.lv}" style="width:${Math.max(4, ratio * 100)}%"></i></span>${esc(i.cat || "")}${i.cost ? ` · ${money(i.cost)}/${i.unit}` : ""}</span>
      </button>`;
    }).join("") : `<div class="empty"><b>Nema rezultata</b>Promeni filter ili dodaj novi artikal.</div>`;
  };
  draw();
  $("#stQ").oninput = e => { stFilter.q = e.target.value; draw(); };
  $$("[data-st]").forEach(b => b.onclick = () => { stFilter.st = b.dataset.st; render(true); });
  $$("[data-cat]").forEach(b => b.onclick = () => { stFilter.cat = b.dataset.cat; render(true); });
};

  const ms = monthStart(today());

    <div class="card">
      <h2>Predlog nabavke</h2>

      ${Object.keys(groups).length ? Object.entries(groups).map(([sup, list], gi) => `

          <div class="tbl-wrap"><table><thead><tr><th>Artikal</th><th class="r">Ima</th><th class="r">Naruči</th><th class="r">Procena</th></tr></thead><tbody>
          ${list.map(({ i, q }) => `<tr class="click" data-item="${i.id}"><td><b>${esc(i.name)}</b> ${status(i).k !== "ok" ? `<span class="pill p-${status(i).lv}">${status(i).t}</span>` : ""}</td><td class="r">${fq(i.stock || 0, i.unit)}</td><td class="r"><b>${fq(q, i.unit)}</b></td><td class="r">${i.cost ? money(q * i.cost) : "–"}</td></tr>`).join("")}
          </tbody></table></div>
          <div class="row" style="margin:10px 0 8px">
            <button class="btn b-green b-sm" data-wa="${gi}">Pošalji dobavljaču</button>
            <button class="btn b-line b-sm" data-copy="${gi}">Kopiraj spisak</button>
            <button class="btn b-line b-sm" data-asp="${gi}">Unesi kao nabavku</button>
          </div></details>`).join("") : `<div class="empty"><b>Ništa ne treba naručiti</b>Kad nešto bude pri kraju, pojaviće se ovde sa predlogom količine.</div>`}
    </div>
    ${Object.keys(bySup).length ? `<div class="card" style="margin-top:14px"><h2>Ovog meseca po dobavljaču</h2><div class="chips">${Object.entries(bySup).sort((a, b) => b[1] - a[1]).map(([s, v]) => `<span class="chip">${esc(s)} <b style="margin-left:6px">${money(v)}</b></span>`).join("")}</div></div>` : ""}
    <div class="card" style="margin-top:14px">
      <h2>Istorija nabavki</h2>
      ${hist.length ? `<div class="tbl-wrap"><table><thead><tr><th>Datum</th><th>Dobavljač</th><th>Račun</th><th class="r">Stavki</th><th class="r">Iznos</th></tr></thead><tbody>
        ${hist.map(p => `<tr class="click" data-pid="${p.id}"><td>${fDay(p.date)}</td><td><b>${esc(p.supplier || "–")}</b></td><td>${esc(p.invoice || "")}</td><td class="r">${(p.lines || []).length}</td><td class="r"><b>${money(p.total)}</b></td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty"><b>Još nema nabavki</b>Svaku robu koju primiš unesi ovde, stanje i cena se sami ažuriraju.</div>`}
    </div>`;
  const G = Object.entries(groups);
  const listTxt = gi => { const [sup, list] = G[gi]; return `Poručujem za ALBEYK (${fDay(today())}):\n` + list.map(({ i, q }) => `- ${i.name}: ${fq(q, i.unit)}`).join("\n") + `\nHvala!`; };
  $$("[data-wa]").forEach(b => b.onclick = () => window.open(`https://wa.me/?text=${encodeURIComponent(listTxt(+b.dataset.wa))}`, "_blank", "noopener"));
  $$("[data-copy]").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(listTxt(+b.dataset.copy)); toast("Spisak je kopiran."); } catch(e){ toast("Kopiranje nije uspelo."); } });
  $$("[data-asp]").forEach(b => b.onclick = () => { const [sup, list] = G[+b.dataset.asp]; purchaseSheet({ supplier: sup === "Bez dobavljača" ? "" : sup, lines: list.map(({ i, q }) => ({ itemId: i.id, qty: q, price: i.lastPrice || i.cost || "" })) }); });
  $$("[data-pid]").forEach(r => r.onclick = () => purchaseDetail(r.dataset.pid));
};

      ${cats.map(c => `<details class="fold"><summary>${CATN[c] || c}<span class="pill p-gray" data-catcnt="${c}"></span></summary>
        ${MENU_LIST.filter(m => m.cat === c).map(m => `<div class="pick"><span class="pn">${esc(m.name)}${S.recipes[m.id] ? "" : `<small style="color:var(--red)">nema normativ</small>`}</span><input class="in" inputmode="numeric" data-local="${m.id}" placeholder="0" value="${CL.local[m.id] || ""}"></div>`).join("")}
      </details>`).join("")}
      <p class="small" id="localSum" style="margin-bottom:0"></p>
    </div>

    <h3 class="sec">2. Ostala potrošnja i otpis</h3>
    <div class="card" style="max-width:900px">
      <p class="small muted" style="margin-top:0">Npr. promenjeno ulje, potrošene rukavice, bačen paradajz.</p>
      <div class="chips" style="margin-bottom:10px">${["ulje","rukavice","salvete","paradajz","iceberg"].filter(id => S.itemMap[id]).map(id => `<button class="chip" data-qadd="${id}">+ ${esc(S.itemMap[id].name)}</button>`).join("")}</div>
      <div class="lines" id="otherLines"></div>
      <button class="btn b-line b-sm" id="addOther" style="margin-top:10px">+ Dodaj red</button>

    </div>
    ${S.closings.length ? `<h3 class="sec">Prethodna zatvaranja</h3><div class="card" style="max-width:900px"><div class="tbl-wrap"><table><thead><tr><th>Dan</th><th>Smena</th><th class="r">Prodato u lokalu</th><th class="r">Otpis/potrošnja</th><th class="r">Popis</th><th class="r">Vrednost</th></tr></thead><tbody>
      ${[...S.closings].sort((a, b) => b.day.localeCompare(a.day) || b.at - a.at).slice(0, 20).map(c => `<tr><td>${fDay(c.day)}</td><td>${c.shiftId === "ceo" ? "Ceo dan" : esc(shiftDef(c.shiftId).name)}</td><td class="r">${c.localCount || 0} kom</td><td class="r">${c.otherCount || 0}</td><td class="r">${c.counted ? c.counted + " art." : "–"}</td><td class="r">${money(c.value)}</td></tr>`).join("")}
    </tbody></table></div></div>` : ""}`;
  const drawOther = () => {
    $("#otherLines").innerHTML = CL.other.length ? CL.other.map((l, k) => `<div class="line" style="grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1.4fr) 40px">

      <div><input class="in" inputmode="decimal" data-ol="${k}" data-f="qty" value="${l.qty ?? ""}" placeholder="Količina"><div class="u">${l.itemId && S.itemMap[l.itemId] ? S.itemMap[l.itemId].unit : ""}</div></div>
      <select class="in" data-ol="${k}" data-f="type"><option value="potrosnja" ${l.type === "potrosnja" ? "selected" : ""}>Potrošeno</option><option value="otpis" ${l.type === "otpis" ? "selected" : ""}>Bačeno / pokvareno</option></select>

    $$("[data-odel]").forEach(b => b.onclick = () => { CL.other.splice(+b.dataset.odel, 1); drawOther(); updateCounts(); });

    const { need, missing } = DB.calcNeed(sold, S.recipes);
    CL.other.forEach(l => { const q = pn(l.qty); if(l.itemId && q > 0) need[l.itemId] = (need[l.itemId] || 0) + q; });

  $("#doCount").onchange = e => { CL.doCount = e.target.checked; $("#countBox").hidden = !CL.doCount; updateCounts(); };

};

function csv(name, rows){
  const txt = "\ufeff" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type:"text/csv;charset=utf-8" })); a.download = `${name}-${today()}.csv`; document.body.appendChild(a); a.click(); a.remove();
}
const saveSet = patch => { S.set = Object.assign({}, S.set, patch); render(true); return DB.setDoc("inv_settings", "main", patch, true).catch(fail); };

const stockOp = (itemId, qty) => ({ op:"update", col:"inv_items", id: itemId, data:{ stock: DB.INC(r3(qty)) } });

/* ===== ARTIKAL ===== */
function itemSheet(id, onSaved){
  const it = id ? S.itemMap[id] : null;
  if(id && !it) return;
  const s = it ? (STATS[it.id] || {}) : {};
  const moves = it ? S.moves.filter(m => m.itemId === id).sort((a, b) => b.ts - a.ts).slice(0, 40) : [];
  const usedIn = it ? MENU_LIST.filter(m => (S.recipes[m.id]?.lines || []).some(l => l.itemId === id)) : [];
  const cats = [...new Set(S.items.map(i => i.cat).filter(Boolean).concat(["Meso","Pecivo","Smrznuto","Povrće","Sir","Sosovi","Piće","Ambalaža","Ostalo"]))];
  const sups = [...new Set(S.items.map(i => i.supplier).concat(S.purchases.map(p => p.supplier)).filter(Boolean))];
  const form = `
    <div class="fr"><div class="f" style="grid-column:1/-1"><label for="iName">Naziv</label><input class="in" id="iName" value="${esc(it?.name || "")}" placeholder="npr. Doner meso"></div></div>
    <div class="fr">
      <div class="f"><label for="iUnit">Jedinica</label><select class="in" id="iUnit">${Object.keys(UNITS).map(u => `<option ${it?.unit === u ? "selected" : ""}>${u}</option>`).join("")}</select></div>
      <div class="f"><label for="iCat">Kategorija</label><input class="in" id="iCat" list="catList" value="${esc(it?.cat || "")}"><datalist id="catList">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist></div>
      <div class="f"><label for="iMin">Minimum na stanju</label><input class="in" id="iMin" inputmode="decimal" value="${it ? num(it.min || 0, 3) : ""}"><small>Ispod ovoga stiže upozorenje.</small></div>
      <div class="f"><label for="iCost">Cena po jedinici (RSD)</label><input class="in" id="iCost" inputmode="decimal" value="${it?.cost ? num(it.cost, 2) : ""}"><small>Menja se sama posle svake nabavke.</small></div>
      <div class="f"><label for="iSup">Dobavljač</label><input class="in" id="iSup" list="supList" value="${esc(it?.supplier || "")}"><datalist id="supList">${sups.map(c => `<option value="${esc(c)}">`).join("")}</datalist></div>
      ${it ? "" : `<div class="f"><label for="iStock">Trenutno stanje</label><input class="in" id="iStock" inputmode="decimal" placeholder="0"></div>`}
    </div>`;
  const body = it ? `
    <div class="grid g3" style="margin-bottom:14px">
      <div class="kpi" style="background:var(--soft)"><span>Na stanju</span><b style="color:${status(it).lv === "red" ? "var(--red)" : "inherit"}">${fq(it.stock || 0, it.unit)}</b><small>${status(it).t}</small></div>
      <div class="kpi" style="background:var(--soft)"><span>Troši se dnevno</span><b>${s.avg ? fq(s.avg, it.unit) : "–"}</b><small>${s.avg ? "dovoljno za " + daysTxt(s.days) : "nema potrošnje 7 dana"}</small></div>
      <div class="kpi" style="background:var(--soft)"><span>Vrednost</span><b>${money(Math.max(0, it.stock || 0) * (it.cost || 0))}</b><small>${it.cost ? money(it.cost) + " / " + it.unit : "unesi cenu"}</small></div>
    </div>
    <div class="row" style="margin-bottom:14px">
      <button class="btn b-gold b-sm" id="aAdd">+ Primljeno (nabavka)</button>
      <button class="btn b-line b-sm" id="aWaste">− Potrošeno / otpis</button>
      <button class="btn b-line b-sm" id="aCount">Prebrojano (popis)</button>
    </div>
    ${usedIn.length ? `<p class="small muted">Koristi se u: ${usedIn.map(m => esc(m.name)).join(", ")}</p>` : ""}
    <details class="fold"><summary>Izmeni podatke</summary>${form}<div class="row" style="padding-bottom:12px"><button class="btn b-ink b-sm" id="iSave">Sačuvaj izmene</button><span class="spacer"></span><button class="btn b-ghost" id="iArch">Ukloni artikal</button></div></details>
    <h3 class="sec" style="margin-top:6px">Kretanje</h3>
    ${moves.length ? `<div class="tbl-wrap"><table><thead><tr><th>Dan</th><th>Vrsta</th><th class="r">Količina</th><th>Napomena</th></tr></thead><tbody>${moves.map(m => `<tr><td>${fDay(m.day)}<br><small class="muted">${hm(m.ts)}</small></td><td>${TYPES[m.type] || m.type}</td><td class="r"><b style="color:${m.qty < 0 ? "var(--red)" : "var(--green)"}">${m.qty > 0 ? "+" : ""}${fq(m.qty, it.unit)}</b></td><td class="small">${esc(m.note || "")}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted small">Još nema kretanja.</p>`}`
  : form;
  openSheet(it ? esc(it.name) : "Novi artikal", body, it ? "" : `<button class="btn b-line" data-close>Otkaži</button><span class="spacer"></span><button class="btn b-gold" id="iSave">Sačuvaj artikal</button>`, !!it);
  const read = () => ({ name: $("#iName").value.trim(), unit: $("#iUnit").value, cat: $("#iCat").value.trim() || "Ostalo", min: pn($("#iMin").value) || 0, cost: pn($("#iCost").value) || 0, supplier: $("#iSup").value.trim() });
  $("#iSave").onclick = async () => {
    const d = read(); if(d.name.length < 2){ $("#iName").focus(); return toast("Upiši naziv artikla."); }
    try {
      if(it){ await DB.updateDoc("inv_items", it.id, d); toast("Sačuvano."); closeSheet(); }
      else {
        const nid = d.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "dj").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || DB.newId("inv_items");
        const iid = S.itemMap[nid] ? nid + "-" + Date.now().toString(36).slice(-4) : nid;
        const st = pn($("#iStock").value) || 0;
        const ops = [{ op:"set", col:"inv_items", id: iid, data: Object.assign(d, { stock: 0, active: true, createdAt: Date.now() }) }];
        if(st){ ops.push(stockOp(iid, st)); ops.push(moveOp(iid, st, "popis", "Početno stanje", "", null, d.cost)); }
        await DB.batchWrite(ops); toast("Artikal je dodat."); closeSheet();
        if(onSaved) onSaved(iid);
      }
    } catch(e){ fail(e); }
  };
  if(it){
    $("#aAdd").onclick = () => purchaseSheet({ supplier: it.supplier || "", lines: [{ itemId: it.id, qty: "", price: it.lastPrice || it.cost || "" }] });
    $("#aWaste").onclick = () => adjustSheet(it.id, "otpis");
    $("#aCount").onclick = () => adjustSheet(it.id, "popis");
    $("#iArch").onclick = () => { if(confirm(`Ukloniti „${it.name}“ iz magacina? Istorija ostaje sačuvana.`)) DB.updateDoc("inv_items", it.id, { active:false }).then(() => { closeSheet(); toast("Artikal je uklonjen."); }).catch(fail); };
  }
}

function adjustSheet(itemId, mode){
  const it = itemId ? S.itemMap[itemId] : null;
  const isCount = mode === "popis";
  openSheet(isCount ? "Prebrojano stanje" : "Potrošeno ili bačeno", `
    ${it ? "" : `<div class="f"><label for="aItem">Artikal</label><select class="in" id="aItem">${itemOptions("")}</select></div>`}
    ${it ? `<p class="muted" style="margin-top:0"><b style="color:var(--ink)">${esc(it.name)}</b>, po sistemu ${fq(it.stock || 0, it.unit)}</p>` : ""}
    <div class="f"><label for="aQty">${isCount ? "Koliko stvarno ima" : "Koliko"} <span id="aU">${it ? it.unit : ""}</span></label><input class="in" id="aQty" inputmode="decimal" autofocus></div>
    ${isCount ? `<p class="small" id="aDiff"></p>` : `<div class="f"><span class="lb">Razlog</span><div class="chips"><button class="chip" data-r="potrosnja" aria-pressed="true">Potrošeno</button><button class="chip" data-r="otpis" aria-pressed="false">Bačeno / pokvareno</button></div></div>
    <div class="f"><label for="aNote">Napomena</label><input class="in" id="aNote" placeholder="npr. promenjeno ulje"></div>`}`,
    `<button class="btn b-line" data-close>Otkaži</button><span class="spacer"></span><button class="btn b-red" id="aGo">Sačuvaj</button>`);
  let reason = "potrosnja";
  const cur = () => it || S.itemMap[$("#aItem")?.value];
  $$("[data-r]").forEach(b => b.onclick = () => { reason = b.dataset.r; $$("[data-r]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  const ai = $("#aItem"); if(ai) ai.onchange = () => { $("#aU").textContent = cur()?.unit || ""; };
  $("#aQty").oninput = () => { const i = cur(), q = pn($("#aQty").value); if(isCount && i && !isNaN(q)) $("#aDiff").innerHTML = `Razlika: <b>${q - (i.stock || 0) > 0 ? "+" : ""}${fq(r3(q - (i.stock || 0)), i.unit)}</b>`; };
  $("#aGo").onclick = async () => {
    const i = cur(), q = pn($("#aQty").value);
    if(!i) return toast("Izaberi artikal.");
    if(isNaN(q) || (!isCount && q <= 0)) return toast("Upiši količinu.");
    const delta = isCount ? r3(q - (i.stock || 0)) : -q;
    if(!delta){ closeSheet(); return toast("Nema razlike, stanje je tačno."); }
    try { await DB.batchWrite([stockOp(i.id, delta), moveOp(i.id, delta, isCount ? "popis" : reason, isCount ? "Prebrojano" : ($("#aNote").value.trim() || ""))]); closeSheet(); toast("Stanje je ažurirano."); } catch(e){ fail(e); }
  };
}

/* ===== NABAVKA ===== */
let PD = null;
function purchaseSheet(pre){
  PD = { date: today(), supplier:"", invoice:"", note:"", lines:[{ itemId:"", qty:"", price:"" }] };
  if(pre) Object.assign(PD, JSON.parse(JSON.stringify(pre)));
  drawPurchase();
}
function drawPurchase(){
  const sups = [...new Set(S.items.map(i => i.supplier).concat(S.purchases.map(p => p.supplier)).filter(Boolean))];
  openSheet("Nova nabavka", `
    <div class="fr">
      <div class="f"><label for="pDate">Datum</label><input class="in" type="date" id="pDate" value="${PD.date}" max="${today()}"></div>
      <div class="f"><label for="pSup">Dobavljač</label><input class="in" id="pSup" list="pSupL" value="${esc(PD.supplier)}" placeholder="npr. Metro"><datalist id="pSupL">${sups.map(s => `<option value="${esc(s)}">`).join("")}</datalist></div>
      <div class="f"><label for="pInv">Broj računa / otpremnice</label><input class="in" id="pInv" value="${esc(PD.invoice)}"></div>
    </div>
    <div class="lines" id="pLines"></div>
    <div class="row" style="margin:10px 0"><button class="btn b-line b-sm" id="pAdd">+ Još jedan artikal</button><button class="btn b-ghost" id="pNewItem">Artikal ne postoji? Dodaj novi</button></div>
    <div class="totbar"><span>Ukupno</span><span id="pTot">0 RSD</span></div>`,
    `<button class="btn b-line" data-close>Otkaži</button><span class="spacer"></span><button class="btn b-gold" id="pSave">Sačuvaj nabavku</button>`, true);
  const sync = () => { PD.date = $("#pDate").value || today(); PD.supplier = $("#pSup").value; PD.invoice = $("#pInv").value; };
  ["#pDate","#pSup","#pInv"].forEach(s => $(s).oninput = sync);
  const total = () => PD.lines.reduce((s, l) => s + (pn(l.qty) || 0) * (pn(l.price) || 0), 0);
  const draw = () => {
    $("#pLines").innerHTML = PD.lines.map((l, k) => { const it = S.itemMap[l.itemId], lt = (pn(l.qty) || 0) * (pn(l.price) || 0);
      return `<div class="line">
        <div><select class="in" data-pl="${k}" data-f="itemId" aria-label="Artikal">${itemOptions(l.itemId)}</select>${it && it.cost ? `<div class="u">Prethodno: ${money(it.lastPrice || it.cost)} / ${it.unit}</div>` : ""}</div>
        <div><input class="in" data-pl="${k}" data-f="qty" inputmode="decimal" placeholder="Količina" value="${esc(l.qty)}" aria-label="Količina"><div class="u">${it ? it.unit : ""}</div></div>
        <div><input class="in" data-pl="${k}" data-f="price" inputmode="decimal" placeholder="Cena / jed." value="${esc(l.price)}" aria-label="Cena po jedinici"><div class="u">RSD po ${it ? it.unit : "jed."}</div></div>
        <div><input class="in" data-pl="${k}" data-f="lt" inputmode="decimal" placeholder="Ukupno" value="${lt ? Math.round(lt * 100) / 100 : ""}" aria-label="Ukupno za red"><div class="u">ukupno RSD</div></div>
        <button class="del" data-pdel="${k}" aria-label="Ukloni red">×</button></div>`; }).join("");
    $("#pTot").textContent = money(total());
    $$("[data-pl]").forEach(el => { el.oninput = el.onchange = () => {
      const l = PD.lines[+el.dataset.pl], f = el.dataset.f;
      if(f === "lt"){ const q = pn(l.qty), t = pn(el.value); if(q > 0 && !isNaN(t)) { l.price = String(Math.round(t / q * 100) / 100); const pe = $(`[data-pl="${el.dataset.pl}"][data-f="price"]`); if(pe) pe.value = l.price; } }
      else l[f] = el.value;
      if(f === "itemId"){ const it = S.itemMap[l.itemId]; if(it && !l.price) l.price = String(it.lastPrice || it.cost || ""); draw(); return; }
      if(f !== "lt"){ const lt = $(`[data-pl="${el.dataset.pl}"][data-f="lt"]`); const v = (pn(l.qty) || 0) * (pn(l.price) || 0); if(lt) lt.value = v ? Math.round(v * 100) / 100 : ""; }
      $("#pTot").textContent = money(total());
    }; });
    $$("[data-pdel]").forEach(b => b.onclick = () => { PD.lines.splice(+b.dataset.pdel, 1); if(!PD.lines.length) PD.lines.push({ itemId:"", qty:"", price:"" }); draw(); });
  };
  draw();
  $("#pAdd").onclick = () => { PD.lines.push({ itemId:"", qty:"", price:"" }); draw(); $$("#pLines select").pop()?.focus(); };
  $("#pNewItem").onclick = () => { sync(); itemSheet(null, iid => { const empty = PD.lines.find(l => !l.itemId); if(empty) empty.itemId = iid; else PD.lines.push({ itemId: iid, qty:"", price:"" }); setTimeout(drawPurchase, 50); }); };
  $("#pSave").onclick = async () => {
    sync();
    const lines = PD.lines.filter(l => l.itemId && pn(l.qty) > 0).map(l => ({ itemId: l.itemId, qty: r3(pn(l.qty)), price: Math.round((pn(l.price) || 0) * 100) / 100 }));
    if(!lines.length) return toast("Dodaj bar jedan artikal sa količinom.");
    if(lines.some(l => !l.price) && !confirm("Neki redovi nemaju cenu. Sačuvati ipak? Cena koštanja tada neće biti tačna.")) return;
    const pid = DB.newId("inv_purchases"), ops = [], tmp = {};
    lines.forEach(l => {
      const it = S.itemMap[l.itemId], t = tmp[l.itemId] || (tmp[l.itemId] = { stock: it.stock || 0, cost: it.cost || 0 });
      l.prevPrice = it.lastPrice || it.cost || 0;
      const newCost = l.price ? (t.stock > 0 ? (t.stock * t.cost + l.qty * l.price) / (t.stock + l.qty) : l.price) : t.cost;
      t.stock += l.qty; t.cost = Math.round(newCost * 100) / 100;
      ops.push(stockOp(l.itemId, l.qty));
      ops.push(moveOp(l.itemId, l.qty, "nabavka", PD.supplier ? "Od: " + PD.supplier : "", pid, PD.date, l.price || t.cost));
    });
    Object.entries(tmp).forEach(([iid, t]) => { const ln = lines.filter(l => l.itemId === iid).pop(); const d = { cost: t.cost }; if(ln.price) d.lastPrice = ln.price; if(PD.supplier) d.supplier = PD.supplier.trim(); ops.push({ op:"update", col:"inv_items", id: iid, data: d }); });
    ops.unshift({ op:"set", col:"inv_purchases", id: pid, data:{ date: PD.date, ts: Date.now(), supplier: PD.supplier.trim(), invoice: PD.invoice.trim(), lines, total: Math.round(lines.reduce((s, l) => s + l.qty * l.price, 0)) } });
    $("#pSave").disabled = true;
    try { await DB.batchWrite(ops); closeSheet(); toast("Nabavka je sačuvana, stanje je ažurirano."); } catch(e){ $("#pSave").disabled = false; fail(e); }
  };
}
function purchaseDetail(pid){
  const p = S.purchases.find(x => x.id === pid); if(!p) return;
  openSheet(`Nabavka ${fDay(p.date)}`, `<p class="muted" style="margin-top:0"><b style="color:var(--ink)">${esc(p.supplier || "Bez dobavljača")}</b>${p.invoice ? ", račun " + esc(p.invoice) : ""}</p>
    <div class="tbl-wrap"><table><thead><tr><th>Artikal</th><th class="r">Količina</th><th class="r">Cena</th><th class="r">Ukupno</th></tr></thead><tbody>
    ${(p.lines || []).map(l => { const i = S.itemMap[l.itemId] || {}; return `<tr><td>${esc(i.name || l.itemId)}</td><td class="r">${fq(l.qty, i.unit)}</td><td class="r">${money(l.price)}</td><td class="r">${money(l.qty * l.price)}</td></tr>`; }).join("")}
    <tr class="tot"><td colspan="3">Ukupno</td><td class="r">${money(p.total)}</td></tr></tbody></table></div>`,
    `<button class="btn b-ghost" id="pDel">Obriši nabavku</button><span class="spacer"></span><button class="btn b-ink" data-close>Zatvori</button>`, true);
  $("#pDel").onclick = async () => {
    if(!confirm("Obrisati ovu nabavku? Količine se skidaju sa stanja.")) return;
    const ops = [{ op:"delete", col:"inv_purchases", id: p.id }];
    (p.lines || []).forEach(l => { if(S.itemMap[l.itemId]){ ops.push(stockOp(l.itemId, -l.qty)); ops.push(moveOp(l.itemId, -l.qty, "korekcija", "Obrisana nabavka " + (p.supplier || ""), p.id)); } });
    try { await DB.batchWrite(ops); closeSheet(); toast("Nabavka je obrisana."); } catch(e){ fail(e); }
  };
}

/* ===== NORMATIV ===== */
function recipeSheet(mid){
  const m = MENU_LIST.find(x => x.id === mid); if(!m) return;
  let lines = JSON.parse(JSON.stringify(S.recipes[mid]?.lines || DEFAULT_RECIPES[mid] || []));
  const isNew = !S.recipes[mid];
  openSheet(esc(m.name), `${isNew ? `<p class="small" style="margin-top:0"><span class="pill p-gold">predlog</span> Ovaj normativ još nije sačuvan. Proveri količine pa sačuvaj.</p>` : ""}
    <div class="lines" id="rLines"></div><button class="btn b-line b-sm" id="rAdd" style="margin-top:10px">+ Sastojak</button>
    <div class="card" style="background:var(--soft);margin-top:14px"><div class="totbar"><span>Cena koštanja</span><span id="rCost"></span></div><p class="small muted" id="rFc" style="margin:6px 0 0"></p></div>`,
    `<button class="btn b-line" data-close>Otkaži</button><span class="spacer"></span><button class="btn b-gold" id="rSave">Sačuvaj normativ</button>`);
  const draw = () => {
    $("#rLines").innerHTML = lines.map((l, k) => { const it = S.itemMap[l.itemId]; return `<div class="line rec"><select class="in" data-rl="${k}" data-f="itemId">${itemOptions(l.itemId)}</select>
      <div><input class="in" data-rl="${k}" data-f="qty" inputmode="decimal" value="${l.qty === "" ? "" : num(l.qty, 3)}" aria-label="Količina"><div class="u">${it ? it.unit + (it.cost ? " · " + money((pn(l.qty) || 0) * it.cost) : "") : ""}</div></div>
      <button class="del" data-rdel="${k}" aria-label="Ukloni">×</button></div>`; }).join("") || `<p class="muted small">Nema sastojaka.</p>`;
    const cost = lines.reduce((s, l) => s + (pn(l.qty) || 0) * (S.itemMap[l.itemId]?.cost || 0), 0);
    $("#rCost").textContent = money(cost);
    $("#rFc").textContent = m.price ? `Prodajna cena ${money(m.price)}. Roba je ${Math.round(cost / m.price * 100)}% cene, zarada pre ostalih troškova ${money(m.price - cost)}.` : "";
    $$("[data-rl]").forEach(el => el.onchange = el.oninput = () => { const l = lines[+el.dataset.rl]; l[el.dataset.f] = el.dataset.f === "qty" ? el.value : el.value; if(el.dataset.f === "itemId" || el.type !== "text" && el.tagName === "SELECT") draw(); else { const c = lines.reduce((s, x) => s + (pn(x.qty) || 0) * (S.itemMap[x.itemId]?.cost || 0), 0); $("#rCost").textContent = money(c); } });
    $$("[data-rdel]").forEach(b => b.onclick = () => { lines.splice(+b.dataset.rdel, 1); draw(); });
  };
  draw();
  $("#rAdd").onclick = () => { lines.push({ itemId:"", qty:"" }); draw(); };
  $("#rSave").onclick = async () => {
    const clean = lines.filter(l => l.itemId && pn(l.qty) > 0).map(l => ({ itemId: l.itemId, qty: r3(pn(l.qty)) }));
    try { await DB.setDoc("recipes", mid, { lines: clean, name: m.name, updatedAt: Date.now() }); closeSheet(); toast("Normativ je sačuvan."); } catch(e){ fail(e); }
  };
}

/* ===== OBROK RADNIKA ===== */
function mealSheet(){
  const workers = S.workers.filter(w => w.active !== false);
  if(!workers.length){ toast("Prvo dodaj radnike."); go("radnici", "lista"); return; }
  const onShift = new Set(S.shifts.filter(s => s.date === today()).map(s => s.workerId));
  const ord = [...workers].sort((a, b) => onShift.has(b.id) - onShift.has(a.id) || a.name.localeCompare(b.name, "sr"));
  const M = { workerId: ord[0].id, date: today(), qty: {}, q:"" };
  openSheet("Obrok radnika", `
    <div class="f"><span class="lb">Ko je jeo</span><div class="chips" id="mW">${ord.map(w => `<button class="chip" data-mw="${w.id}" aria-pressed="${w.id === M.workerId}">${esc(w.name)}${onShift.has(w.id) ? " ●" : ""}</button>`).join("")}</div><small>● radi danas</small></div>
    <div class="fr"><div class="f"><label for="mDate">Dan</label><input class="in" type="date" id="mDate" value="${M.date}" max="${today()}"></div><div class="f"><label for="mQ">Traži jelo</label><input class="in" id="mQ" type="search" placeholder="npr. zurna"></div></div>
    <div id="mList"></div>`,
    `<span class="totbar" style="font-size:16px"><span>Trošak&nbsp;</span><span id="mCost">0 RSD</span></span><span class="spacer"></span><button class="btn b-line" data-close>Otkaži</button><button class="btn b-gold" id="mSave">Sačuvaj</button>`);
  const cost = () => Object.entries(M.qty).reduce((s, [id, q]) => s + q * recipeCost(id), 0);
  const draw = () => {
    const q = M.q.trim().toLowerCase();

async function saveClosing(){
  const sold = Object.entries(CL.local).filter(([, q]) => pn(q) > 0).map(([id, q]) => ({ id, qty: pn(q), name: menuName(id) }));
  const { need, missing } = DB.calcNeed(sold, S.recipes);
  const other = CL.other.filter(l => l.itemId && pn(l.qty) > 0);
  const counts = CL.doCount ? Object.entries(CL.count).filter(([id, v]) => S.itemMap[id] && !isNaN(pn(v)) && String(v).trim() !== "") : [];
  if(!sold.length && !other.length && !counts.length && !confirm("Ništa nije uneto. Zatvoriti smenu bez promena?")) return;
  if(missing.length && !confirm(`Ova jela nemaju normativ i neće se skinuti: ${missing.join(", ")}. Nastaviti?`)) return;
  const ops = [], day = CL.date, after = {};
  let value = 0;
  const label = CL.shiftId === "ceo" ? "Ceo dan" : shiftDef(CL.shiftId).name;
  Object.entries(need).forEach(([iid, q]) => { if(!S.itemMap[iid]) return; ops.push(stockOp(iid, -q)); ops.push(moveOp(iid, -q, "lokal", "Lokal, " + label, "", day)); after[iid] = (after[iid] || 0) - q; value += q * (S.itemMap[iid].cost || 0); });
  other.forEach(l => { const q = pn(l.qty); ops.push(stockOp(l.itemId, -q)); ops.push(moveOp(l.itemId, -q, l.type, label, "", day)); after[l.itemId] = (after[l.itemId] || 0) - q; value += q * (S.itemMap[l.itemId].cost || 0); });
  let counted = 0;
  counts.forEach(([iid, v]) => { const it = S.itemMap[iid], exp = r3((it.stock || 0) + (after[iid] || 0)), diff = r3(pn(v) - exp); counted++; if(Math.abs(diff) >= .0005){ ops.push(stockOp(iid, diff)); ops.push(moveOp(iid, diff, "popis", "Popis, " + label, "", day)); } });
  ops.push({ op:"set", col:"closings", id: `${day}_${CL.shiftId}_${Date.now().toString(36)}`, data:{ day, shiftId: CL.shiftId, at: Date.now(), localCount: sold.reduce((s, x) => s + x.qty, 0), otherCount: other.length, counted, value: Math.round(value), note: CL.note.trim(), sold } });
  $("#clSave").disabled = true;
  try { await DB.batchWrite(ops); CL = null; toast("Smena je zatvorena, stanje je ažurirano."); go("pregled"); } catch(e){ $("#clSave").disabled = false; fail(e); }
}

/* ===== automatsko skidanje porudžbina sa sajta ===== */
const inFlight = new Set();
function backfill(){
  S.orders.forEach(o => {
    if(inFlight.has(o.id)) return;
    const take = ["prihvaceno","spremno","preuzeto","nepreuzeto"].includes(o.status) && !o.stockDone;
    const give = o.status === "odbijeno" && o.stockDone;
    if(!take && !give) return;
    inFlight.add(o.id);
    DB.consumeOrder(o.id, give).catch(e => console.error(e)).finally(() => setTimeout(() => inFlight.delete(o.id), 4000));
  });
}

    try { await DB.signIn($("#le").value.trim(), $("#lp").value); }
    catch(err){ loginGesture = false; btn.disabled = false; btn.textContent = "Prijavi se";
      $("#lerr").textContent = /wrong-password|invalid-credential|user-not-found|invalid-email|invalid-login/.test(err.code || "") ? "Pogrešno korisničko ime ili lozinka." : /too-many-requests/.test(err.code || "") ? "Previše pokušaja. Sačekaj minut." : "Prijava nije uspela. Proveri internet."; $("#lp").select(); }
  };
}
function logout(){ if(confirm("Odjaviti se iz magacina?")) DB.signOut(); }
$("#logoutSide").onclick = logout;

function startLive(){
  if(started) return; started = true;
  $("#start").hidden = true;
  const since = Date.now() - 62 * DAY, sinceK = addDays(today(), -62);
  const up = k => { S.loaded[k] = true; schedule(); };
  const err = (k, e) => { console.error(k, e); toast(e && e.code === "permission-denied" ? "Nemaš pristup magacinu. Proveri pravila baze." : "Veza sa bazom je prekinuta."); };
  DB.watchCol("inv_items", (l, e) => { if(!l) return err("items", e); S.items = l; S.itemMap = Object.fromEntries(l.map(i => [i.id, i])); up("items"); });
  DB.watchCol("inv_moves", (l, e) => { if(!l) return err("moves", e); S.moves = l; up("moves"); }, { since });
  DB.watchCol("inv_purchases", (l, e) => { if(!l) return err("purch", e); S.purchases = l; up("purchases"); }, { field:"date", since: addDays(today(), -120) });
  DB.watchCol("recipes", (l, e) => { if(!l) return err("rec", e); S.recipes = Object.fromEntries(l.map(r => [r.id, r])); up("recipes"); });
  DB.watchCol("workers", (l, e) => { if(!l) return err("w", e); S.workers = l; S.wMap = Object.fromEntries(l.map(w => [w.id, w])); up("workers"); });
  DB.watchCol("shifts", (l, e) => { if(!l) return err("sh", e); S.shifts = l; up("shifts"); }, { field:"date", since: sinceK });
  DB.watchCol("meals", (l, e) => { if(!l) return err("meals", e); S.meals = l; up("meals"); }, { since });
  DB.watchCol("closings", (l, e) => { if(!l) return err("cl", e); S.closings = l; up("closings"); }, { field:"day", since: sinceK });
  DB.watchCol("fiscal", (l, e) => { if(!l) return err("fiscal", e); S.fiscal = l; up("fiscal"); }, { since });
  DB.watchDoc("inv_settings", "main", d => { if(d === undefined) return; S.set = Object.assign(JSON.parse(JSON.stringify(DEF_SET)), d || {}); S.loaded.settings = !!d; schedule(); });
  DB.watchOrders(l => { if(!l) return; S.orders = l; backfill(); schedule(); });
  setTimeout(() => { computeStats(); computeAlerts(); const done = readSet(NOTI_KEY); ALERTS.forEach(a => done.add(a.id)); writeSet(NOTI_KEY, done); notifyReady = true; }, 2500);
  setInterval(schedule, 60000);
  const h = location.hash.slice(1); if(NAV.some(n => n.id === h)) route = h;
  render(true);
}
(async function boot(){
  if(EMBED){ document.body.classList.add("embed"); $("#logoutSide").hidden = true; }
  if(!DB){ $("#goBox").hidden = false; $("#goBox").innerHTML = "<p>Nedostaju fajlovi config.js i albeyk-db.js pored ove stranice.</p>"; return; }
  if(DB.mode === "demo") $("#demo").hidden = false;
  try { await DB.init({ staff:true }); } catch(e){ $("#goBox").hidden = false; $("#goBox").innerHTML = "<p>Ne mogu da se povežem sa bazom. Proveri internet i osveži stranicu.</p>"; return; }
  DB.onAuth(u => {
    if(u) startLive();
    else if(started) location.reload();
    else if(EMBED){ $("#goBox").hidden = false; $("#goBox").innerHTML = "<p>Prijavi se na stranici Sve zajedno.</p>"; }
    else showLogin();
  });
})();

</script>
</body>
